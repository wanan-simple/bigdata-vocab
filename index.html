<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大数据技术英语词汇</title>
<style>
/* ========== 基础 ========== */
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f2f5; color: #333; min-height: 100vh; padding: 16px;
}
.container { max-width: 700px; margin: 0 auto; }

/* ========== 头部 ========== */
.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 4px; }
.header .sub { font-size: 13px; color: #999; }

/* ========== 模式切换 Tab ========== */
.tabs {
    display: flex; gap: 0; margin-bottom: 16px;
    border-radius: 12px; overflow: hidden; background: #e0e0e0;
}
.tab {
    flex: 1; text-align: center; padding: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: background 0.2s; user-select: none;
    background: #e8e8e8; color: #888;
}
.tab.active { background: #4a90d9; color: #fff; }

/* ========== 技术栈标签 ========== */
.tag-bar {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
    justify-content: center;
}
.tag-btn {
    padding: 6px 14px; border-radius: 20px; font-size: 13px;
    font-weight: 500; cursor: pointer; border: 2px solid #ccc;
    background: #fff; color: #666; transition: all 0.2s;
    user-select: none;
}
.tag-btn.on { color: #fff; }
.tag-btn.on[data-tag="Java"]       { background: #f89820; border-color: #f89820; }
.tag-btn.on[data-tag="MySQL"]      { background: #4479A1; border-color: #4479A1; }
.tag-btn.on[data-tag="Linux"]      { background: #6b8e23; border-color: #6b8e23; }
.tag-btn.on[data-tag="HDFS"]       { background: #2196F3; border-color: #2196F3; }
.tag-btn.on[data-tag="MapReduce"]  { background: #009688; border-color: #009688; }
.tag-btn.on[data-tag="YARN"]       { background: #00ACC1; border-color: #00ACC1; }
.tag-btn.on[data-tag="Zookeeper"]  { background: #7E57C2; border-color: #7E57C2; }
.tag-btn.on[data-tag="Hive"]       { background: #E37400; border-color: #E37400; }
.tag-btn.on[data-tag="Spark"]      { background: #E25A1C; border-color: #E25A1C; }
.tag-btn.on[data-tag="通用"]       { background: #888;    border-color: #888; }

/* ========== 共享隐藏/显示 ========== */
.panel { display: none; }
.panel.show { display: block; }

/* ==================== 练习模式 ==================== */
.exercise-empty {
    text-align: center; padding: 60px 20px; color: #aaa;
}
.exercise-empty .big-icon { font-size: 48px; margin-bottom: 12px; }

.exercise-card {
    background: #fff; border-radius: 16px; padding: 32px 24px;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 16px;
}
.ex-card-zh {
    font-size: 26px; font-weight: 700; color: #1a1a2e;
    margin-bottom: 4px; word-break: break-all;
}
.ex-card-en {
    font-size: 30px; font-weight: 700; color: #1a1a2e;
    margin-bottom: 4px; word-break: break-all;
}
.ex-card-tag {
    display: inline-block; font-size: 12px; padding: 3px 10px;
    border-radius: 10px; background: #e8f0fe; color: #4a90d9; margin-bottom: 16px;
}
.ex-card-input {
    width: 100%; max-width: 360px; padding: 14px 16px; font-size: 20px;
    text-align: center; border: 2px solid #e0e0e0; border-radius: 12px;
    outline: none; transition: border-color 0.2s; margin-bottom: 12px;
    letter-spacing: 1px;
}
.ex-card-input:focus { border-color: #4a90d9; }
.ex-card-input.correct { border-color: #4caf50; background: #f1f8f1; }
.ex-card-input.wrong   { border-color: #e53935; background: #fff5f5; }

.ex-feedback { font-size: 16px; font-weight: 600; min-height: 28px; margin-bottom: 8px; }
.ex-feedback.ok   { color: #4caf50; }
.ex-feedback.fail { color: #e53935; }

.ex-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
    padding: 12px 24px; border-radius: 10px; font-size: 15px;
    font-weight: 600; cursor: pointer; border: none; transition: all 0.15s;
    user-select: none;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: #4a90d9; color: #fff; }
.btn-outline { background: #fff; color: #4a90d9; border: 2px solid #4a90d9; }
.btn-speaker { background: #fff; color: #4a90d9; border: 2px solid #e0e0e0; font-size: 20px; padding: 10px 18px; }
.btn-ghost    { background: #f5f5f5; color: #888; }
.btn-success  { background: #4caf50; color: #fff; }
.btn-danger   { background: #e53935; color: #fff; }
.btn:disabled { opacity: 0.4; pointer-events: none; }

.ex-stats {
    display: flex; gap: 20px; justify-content: center;
    font-size: 15px; color: #666; margin-bottom: 12px;
}
.ex-stats .ok-count { color: #4caf50; font-weight: 700; }
.ex-stats .fail-count { color: #e53935; font-weight: 700; }
.ex-reset { text-align: center; margin-top: 8px; }
.ex-reset button { font-size: 13px; color: #999; background: none; border: none; cursor: pointer; text-decoration: underline; }

/* ==================== 查询模式 ==================== */
.search-wrap { position: relative; margin-bottom: 12px; }
.search-input {
    width: 100%; padding: 14px 18px; font-size: 16px;
    border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
    transition: border-color 0.2s;
}
.search-input:focus { border-color: #4a90d9; }
.query-stats { text-align: center; font-size: 13px; color: #999; margin-bottom: 12px; }

.word-list { display: flex; flex-direction: column; gap: 8px; }
.word-card {
    background: #fff; border-radius: 12px; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    transition: transform 0.12s; user-select: none;
}
.word-card:active { transform: scale(0.98); }
.word-card .l { display: flex; flex-direction: column; gap: 3px; }
.word-card .en-text { font-size: 17px; font-weight: 600; color: #1a1a2e; }
.word-card .zh-text { font-size: 13px; color: #888; }
.word-card .t {
    display: inline-block; font-size: 11px; background: #e8f0fe;
    color: #4a90d9; padding: 1px 7px; border-radius: 5px; width: fit-content;
}
.word-card .spk { font-size: 20px; color: #4a90d9; flex-shrink: 0; margin-left: 10px; }

/* ========== 手机端 ========== */
@media (max-width: 480px) {
    body { padding: 10px; }
    .header h1 { font-size: 20px; }
    .ex-card-zh { font-size: 22px; }
    .ex-card-en { font-size: 24px; }
    .ex-card-input { font-size: 18px; padding: 12px; }
    .btn { padding: 10px 18px; font-size: 14px; }
}
</style>
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <div class="header">
        <h1>大数据技术英语词汇</h1>
        <p class="sub">记单词 · 练拼写 · 听发音</p>
    </div>

    <!-- 模式切换 -->
    <div class="tabs">
        <div class="tab active" data-mode="exercise" id="tabExercise">🎯 练习模式</div>
        <div class="tab" data-mode="query" id="tabQuery">🔍 查询模式</div>
    </div>

    <!-- 技术栈标签（两种模式共用） -->
    <div class="tag-bar" id="tagBar"></div>

    <!-- ========== 练习模式面板 ========== -->
    <div class="panel show" id="panelExercise">
        <!-- 未选标签时 -->
        <div class="exercise-empty" id="exEmpty">
            <div class="big-icon">📋</div>
            <p>请先勾选上方技术栈标签，再开始练习</p>
        </div>
        <!-- 练习卡片 -->
        <div class="exercise-card" id="exCard" style="display:none">
            <div id="exZh" class="ex-card-zh"></div>
            <div id="exEn" class="ex-card-en"></div>
            <div id="exTag" class="ex-card-tag"></div>
            <input type="text" class="ex-card-input" id="exInput" placeholder="输入英文拼写..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <div class="ex-feedback" id="exFeedback"></div>
            <div class="ex-buttons" id="exButtons"></div>
        </div>
        <!-- 统计 -->
        <div class="ex-stats" id="exStats" style="display:none">
            <span>✅ <span class="ok-count" id="exOk">0</span></span>
            <span>❌ <span class="fail-count" id="exFail">0</span></span>
            <span>📝 <span id="exProgress">0/0</span></span>
        </div>
        <div class="ex-reset" id="exReset" style="display:none">
            <button onclick="resetExercise()">重新开始本轮练习</button>
        </div>
    </div>

    <!-- ========== 查询模式面板 ========== -->
    <div class="panel" id="panelQuery">
        <div class="search-wrap">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索单词或中文释义...">
        </div>
        <p class="query-stats" id="queryStats"></p>
        <div class="word-list" id="wordList"></div>
    </div>

</div>

// =====================================================================
//  全局状态
// =====================================================================
var currentMode = "exercise";        // "exercise" | "query"
var selectedTags = {};               // { "Java": true, "Spark": true, ... }
var allTags = [];

// 练习状态
var exPool = [];        // 当前词池（已选标签下的所有词，shuffle 后）
var exIndex = 0;        // 当前做到第几个
var exCorrect = 0;
var exWrong = 0;
var exAnswered = false; // 当前题是否已答过

// =====================================================================
//  初始化：提取所有标签，渲染标签栏
// =====================================================================
(function init() {
    var tagSet = {};
    for (var i = 0; i < words.length; i++) {
        tagSet[words[i].tag] = true;
    }
    allTags = Object.keys(tagSet);
    renderTagBar();
    switchMode("exercise");
})();

function renderTagBar() {
    var html = "";
    for (var i = 0; i < allTags.length; i++) {
        var t = allTags[i];
        var cls = selectedTags[t] ? "tag-btn on" : "tag-btn";
        html += '<span class="' + cls + '" data-tag="' + t + '" onclick="toggleTag(\'' + t + '\')">' + t + '</span>';
    }
    document.getElementById("tagBar").innerHTML = html;
}

function toggleTag(tag) {
    if (selectedTags[tag]) {
        delete selectedTags[tag];
    } else {
        selectedTags[tag] = true;
    }
    renderTagBar();
    if (currentMode === "exercise") {
        startExercise();
    } else {
        renderQuery();
    }
}

// =====================================================================
//  模式切换
// =====================================================================
function switchMode(mode) {
    currentMode = mode;
    document.getElementById("tabExercise").className = mode === "exercise" ? "tab active" : "tab";
    document.getElementById("tabQuery").className    = mode === "query"    ? "tab active" : "tab";
    document.getElementById("panelExercise").className = mode === "exercise" ? "panel show" : "panel";
    document.getElementById("panelQuery").className    = mode === "query"    ? "panel show" : "panel";

    if (mode === "exercise") {
        startExercise();
    } else {
        renderQuery();
    }
}

document.getElementById("tabExercise").addEventListener("click", function () { switchMode("exercise"); });
document.getElementById("tabQuery").addEventListener("click",    function () { switchMode("query"); });

// =====================================================================
//  工具函数：Fisher-Yates 洗牌
// =====================================================================
function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
}

// =====================================================================
//  发音（双引擎：Web Speech + 音频兜底）
// =====================================================================

var _ttsAudio = null;

// 初始化 Audio 元素，所有浏览器都能用
(function initAudio() {
    _ttsAudio = document.createElement("audio");
    _ttsAudio.id = "ttsAudio";
    _ttsAudio.preload = "auto";
    document.body.appendChild(_ttsAudio);
})();

function speak(text) {
    var synth = window.speechSynthesis;

    // 引擎1: Web Speech API，需要浏览器原生支持且有语音包
    if (synth && synth.getVoices().length > 0) {
        synth.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.rate = 0.85;
        u.volume = 1;
        var voices = synth.getVoices();
        for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang === "en-US" && voices[i].localService) {
                u.voice = voices[i];
                break;
            }
        }
        synth.speak(u);
        return;
    }

    // 引擎2: 在线 TTS 音频，微信/QQ/所有浏览器通用
    // 按单词数量自动选接口（短词用有道，长文本用 Google）
    var wordCount = text.split(/\s+/).length;
    if (wordCount <= 3) {
        // 有道词典 TTS，国内快
        _ttsAudio.src = "https://dict.youdao.com/dictvoice?audio=" +
            encodeURIComponent(text) + "&type=0";
    } else {
        // Google TTS，短语更自然
        _ttsAudio.src = "https://translate.google.com/translate_tts?ie=UTF-8" +
            "&client=tw-ob&tl=en&q=" + encodeURIComponent(text);
    }
    _ttsAudio.play().catch(function () {
        // 有道挂了换 Google，Google 挂了换有道
        if (wordCount <= 3) {
            _ttsAudio.src = "https://translate.google.com/translate_tts?ie=UTF-8" +
                "&client=tw-ob&tl=en&q=" + encodeURIComponent(text);
        } else {
            _ttsAudio.src = "https://dict.youdao.com/dictvoice?audio=" +
                encodeURIComponent(text) + "&type=0";
        }
        _ttsAudio.play();
    });
}

// =====================================================================
//  练习模式
// =====================================================================
function startExercise() {
    // 收集已选标签的词
    var pool = [];
    for (var i = 0; i < words.length; i++) {
        if (selectedTags[words[i].tag]) {
            pool.push(words[i]);
        }
    }

    var card = document.getElementById("exCard");
    var empty = document.getElementById("exEmpty");
    var stats = document.getElementById("exStats");
    var reset = document.getElementById("exReset");

    if (pool.length === 0) {
        card.style.display = "none";
        stats.style.display = "none";
        reset.style.display = "none";
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";
    card.style.display = "block";
    stats.style.display = "flex";
    reset.style.display = "block";

    exPool = shuffle(pool);
    exIndex = 0;
    exCorrect = 0;
    exWrong = 0;
    exAnswered = false;

    showExerciseCard();
    updateExStats();
}

function showExerciseCard() {
    if (exIndex >= exPool.length) {
        // 一轮结束，自动重新洗牌
        exPool = shuffle(exPool);
        exIndex = 0;
    }

    var w = exPool[exIndex];
    var isSpelling = Math.random() < 0.33; // 约 1/3 的概率是拼写题

    exAnswered = false;

    document.getElementById("exFeedback").innerHTML = "";
    document.getElementById("exFeedback").className = "ex-feedback";
    var input = document.getElementById("exInput");
    input.value = "";
    input.className = "ex-card-input";
    input.dataset.answer = w.en;
    input.dataset.spelling = isSpelling ? "1" : "0";

    var tagEl = document.getElementById("exTag");
    tagEl.textContent = w.tag;
    // 给标签加颜色
    tagEl.style.background = getTagBg(w.tag);
    tagEl.style.color = "#fff";

    if (isSpelling) {
        // 拼写题：显示中文，你需要拼英文
        document.getElementById("exZh").style.display = "block";
        document.getElementById("exEn").style.display = "none";
        document.getElementById("exZh").textContent = w.zh;
        input.style.display = "inline-block";
        input.focus();
        document.getElementById("exButtons").innerHTML =
            '<button class="btn btn-primary" id="btnSubmit" onclick="checkSpelling()">提交</button>' +
            '<button class="btn btn-speaker" onclick="speak(\'' + escapeJS(w.en) + '\')" title="听发音提示">🔊</button>';
    } else {
        // 识别题：显示英文，你判断认不认识
        document.getElementById("exZh").style.display = "none";
        document.getElementById("exEn").style.display = "block";
        document.getElementById("exEn").textContent = w.en;
        input.style.display = "none";
        document.getElementById("exButtons").innerHTML =
            '<button class="btn btn-speaker" onclick="speak(\'' + escapeJS(w.en) + '\')">🔊 听发音</button>' +
            '<button class="btn btn-danger" id="btnDontKnow" onclick="revealAnswer()">不认识</button>' +
            '<button class="btn btn-success" id="btnKnow" onclick="markCorrect()">认识</button>';
    }
}

function getTagBg(tag) {
    var map = {
        "Java":"#f89820","MySQL":"#4479A1","Linux":"#6b8e23","HDFS":"#2196F3",
        "MapReduce":"#009688","YARN":"#00ACC1","Zookeeper":"#7E57C2",
        "Hive":"#E37400","Spark":"#E25A1C","通用":"#888"
    };
    return map[tag] || "#888";
}

function escapeJS(s) { return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

// --- 拼写题：检查答案 ---
function checkSpelling() {
    if (exAnswered) return;
    exAnswered = true;

    var input = document.getElementById("exInput");
    var userAnswer = input.value.trim().toLowerCase();
    var correct = input.dataset.answer.toLowerCase();
    var fb = document.getElementById("exFeedback");

    // 模糊匹配：忽略大小写、忽略多余空格
    if (userAnswer === correct) {
        exCorrect++;
        input.className = "ex-card-input correct";
        fb.innerHTML = "✅ 正确！" + (userAnswer !== input.dataset.answer ? "（答案: " + input.dataset.answer + "）" : "");
        fb.className = "ex-feedback ok";
    } else {
        exWrong++;
        input.className = "ex-card-input wrong";
        fb.innerHTML = "❌ 正确答案: <strong>" + input.dataset.answer + "</strong>";
        fb.className = "ex-feedback fail";
        // 拼错时自动朗读
        speak(input.dataset.answer);
    }

    updateExStats();
    var en = input.dataset.answer;
    document.getElementById("exButtons").innerHTML =
        '<button class="btn btn-speaker" onclick="speak(\'' + escapeJS(en) + '\')">🔊 听发音</button>' +
        '<button class="btn btn-primary" onclick="nextQuestion()">下一题 →</button>';
}

// --- 识别题：不认识，显示答案 ---
function revealAnswer() {
    if (exAnswered) return;
    exAnswered = true;
    exWrong++;

    var w = exPool[exIndex];
    // 同时显示英文和中文
    document.getElementById("exEn").style.display = "block";
    document.getElementById("exZh").style.display = "block";
    document.getElementById("exEn").textContent = w.en;
    document.getElementById("exZh").textContent = w.zh;
    document.getElementById("exFeedback").innerHTML = "💡 记住它，下次就认识了";
    document.getElementById("exFeedback").className = "ex-feedback fail";

    updateExStats();
    document.getElementById("exButtons").innerHTML =
        '<button class="btn btn-speaker" onclick="speak(\'' + escapeJS(w.en) + '\')">🔊 再听一遍</button>' +
        '<button class="btn btn-primary" onclick="nextQuestion()">下一题 →</button>';
}

// --- 识别题：认识，正确 ---
function markCorrect() {
    if (exAnswered) return;
    exAnswered = true;
    exCorrect++;

    var w = exPool[exIndex];
    // 同时显示英文和中文，方便复习
    document.getElementById("exEn").style.display = "block";
    document.getElementById("exZh").style.display = "block";
    document.getElementById("exZh").textContent = w.zh;
    document.getElementById("exFeedback").innerHTML = "✅ 不错！";
    document.getElementById("exFeedback").className = "ex-feedback ok";

    updateExStats();
    document.getElementById("exButtons").innerHTML =
        '<button class="btn btn-speaker" onclick="speak(\'' + escapeJS(w.en) + '\')">🔊 听发音</button>' +
        '<button class="btn btn-primary" onclick="nextQuestion()">下一题 →</button>';
}

function nextQuestion() {
    exIndex++;
    showExerciseCard();
    updateExStats();
}

function updateExStats() {
    document.getElementById("exOk").textContent = exCorrect;
    document.getElementById("exFail").textContent = exWrong;
    document.getElementById("exProgress").textContent = (exCorrect + exWrong) + " / " + exPool.length;
}

function resetExercise() {
    startExercise();
}

// 回车键提交拼写
document.addEventListener("keydown", function (e) {
    if (currentMode !== "exercise") return;
    if (e.key === "Enter" && !exAnswered) {
        var input = document.getElementById("exInput");
        if (input.style.display !== "none" && input.dataset.spelling === "1") {
            checkSpelling();
        }
    }
});

// =====================================================================
//  查询模式
// =====================================================================
function renderQuery() {
    var keyword = document.getElementById("searchInput").value.trim().toLowerCase();

    var filtered = words.filter(function (w) {
        // 标签过滤
        var hasSelected = false;
        for (var k in selectedTags) { hasSelected = true; break; }
        if (hasSelected && !selectedTags[w.tag]) return false;

        // 关键词过滤
        if (keyword === "") return true;
        return w.en.toLowerCase().indexOf(keyword) !== -1
            || w.zh.indexOf(keyword) !== -1;
    });

    document.getElementById("queryStats").textContent =
        "共 " + filtered.length + " 个词汇" +
        (keyword ? "（匹配 \"" + keyword + "\"）" : "");

    var html = "";
    for (var i = 0; i < filtered.length; i++) {
        var w = filtered[i];
        html +=
            '<div class="word-card" onclick="speak(\'' + escapeJS(w.en) + '\')">' +
                '<div class="l">' +
                    '<span class="en-text">' + w.en + '</span>' +
                    '<span class="zh-text">' + w.zh + '</span>' +
                    '<span class="t">' + w.tag + '</span>' +
                '</div>' +
                '<span class="spk">🔊</span>' +
            '</div>';
    }
    document.getElementById("wordList").innerHTML = html;
}

document.getElementById("searchInput").addEventListener("input", renderQuery);
</script>
</body>
</html>
